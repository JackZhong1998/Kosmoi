name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve linked Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const token = process.env.VERCEL_TOKEN;
            const response = await fetch('https://api.vercel.com/v9/projects?limit=100', {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) throw new Error(`Unable to list Vercel projects (${response.status})`);
            const { projects = [] } = await response.json();
            const matches = projects.filter((project) => {
              const repo = String(project.link?.repo || '').toLowerCase();
              const name = String(project.name || '').toLowerCase();
              return repo === 'kosmoi' || name === 'kosmoi';
            });
            if (matches.length !== 1) throw new Error(`Expected one Kosmoi Vercel project, found ${matches.length}`);
            const project = matches[0];
            if (!project.id || !project.accountId) throw new Error('Kosmoi project is missing its Vercel identifiers');
            fs.appendFileSync(process.env.GITHUB_ENV, `VERCEL_PROJECT_NAME=${project.name}\nVERCEL_SCOPE=${project.accountId}\n`);
            console.log(`Resolved Vercel project: ${project.name}`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

      - name: Link Vercel project
        run: vercel link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build deployment artifacts
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --archive=tgz --scope="$VERCEL_SCOPE" --token=${{ secrets.VERCEL_TOKEN }}
